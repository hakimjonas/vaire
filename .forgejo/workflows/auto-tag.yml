name: Auto-tag patch release

# On every push to main, cut the next patch tag when the push is a merge
# (PR merged into main). The tag push then triggers release.yml, which runs
# checks, tests, and publishes the clean, tag-derived version.
#
# Version policy (patch level):
#   v1.2.3      -> v1.2.4
#   v1.0.0-RC1  -> v1.0.0-RC2
# Direct (non-merge) pushes are skipped defensively; main is branch-protected
# so they should not happen at all.
on:
  push:
    branches: [main]

jobs:
  cut-release:
    runs-on: docker
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth 2 origin "${GITHUB_REF}:${GITHUB_REF}"
          git checkout -f "${GITHUB_SHA}"

      - name: Cut patch tag (merge commits only)
        env:
          # RELEASE_TOKEN is a repo secret with write access. The FORGEJO_TOKEN
          # name must NOT be used here: the runner reserves it for the run
          # token, which cannot push, shadowing any repo secret of that name.
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # A merge commit has two parents; a direct push has one.
          parents=$(git rev-list --parents -n 1 HEAD | awk '{print NF - 1}')
          if [ "$parents" -lt 2 ]; then
            echo "Direct push (not a merge) — no release tag."
            exit 0
          fi

          # Find the latest version tag by listing remote refs; no tag objects
          # need to be fetched.
          latest=$(git ls-remote --tags --sort=-v:refname origin 'refs/tags/v[0-9]*' \
            | grep -v '\^{}' | head -n 1 | sed 's|.*refs/tags/||')
          if [ -z "$latest" ]; then
            next="0.0.1"
          else
            body="${latest#v}"
            if [[ "$body" == *-RC* ]]; then
              base="${body%-RC*}"
              rc="${body##*-RC}"
              next="${base}-RC$((rc + 1))"
            else
              major="${body%%.*}"
              rest="${body#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              next="${major}.${minor}.$((patch + 1))"
            fi
          fi
          newtag="v${next}"

          if git ls-remote --tags origin "refs/tags/${newtag}" | grep -q "refs/tags/${newtag}$"; then
            echo "Tag ${newtag} already exists — nothing to do."
            exit 0
          fi

          git config user.name "strongbow-release-bot"
          git config user.email "release@strongbow.local"
          git tag "${newtag}"
          git push "http://hakim:${RELEASE_TOKEN}@forgejo:3000/${GITHUB_REPOSITORY}.git" "refs/tags/${newtag}"

          echo "Pushed ${newtag} — release.yml will now build, test, and publish it."
