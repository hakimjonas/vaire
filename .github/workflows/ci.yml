name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_OPTS: "-Xms1G -Xmx3G -XX:+UseZGC -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2"
  SBT_OPTS: "-Xms1G -Xmx3G -XX:+UseZGC -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fast PR gate: exclude the Slow-tagged suites (5M-row stress + TPC-H).
      FAST_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
        with:
          disk-cache: false

      # Own the sbt 2 disk cache so its key is scoped to the sbt version
      # (project/build.properties). setup-sbt's built-in cache restores on a
      # broad prefix, which let a 2.0.8 cache be reused under 2.0.9, skipping
      # the core compile and leaving scalafix without SemanticDB.
      - name: Cache sbt 2.x disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sbt
          key: sbt-disk-${{ runner.os }}-jdk25-${{ hashFiles('project/build.properties') }}-${{ hashFiles('build.sbt', 'project/*.sbt') }}-v1
          restore-keys: |
            sbt-disk-${{ runner.os }}-jdk25-${{ hashFiles('project/build.properties') }}-

      - name: Check style, formatting, and doc coverage
        run: sbt check

      - name: Compile
        run: sbt compile

      - name: Run tests (slow suites excluded)
        run: sbt testAll
        timeout-minutes: 30
