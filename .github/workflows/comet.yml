name: Comet coverage

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 05:00 UTC (after the 04:00 Stress run)
    - cron: "0 5 * * 1"

permissions:
  contents: read

env:
  JAVA_OPTS: "-Xms1G -Xmx3G -XX:+UseZGC -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2"
  SBT_OPTS: "-Xms1G -Xmx3G -XX:+UseZGC -XX:ReservedCodeCacheSize=512m -XX:CICompilerCount=2"
  # The wide plan set's 5M-row collects exceed the harness's 4g default driver heap (see the
  # 2026-10-21 STOP in the wide-table increment), so the scheduled job runs at 8g. The harness
  # default stays 4g; this override is the deliberate adjustment the STOP called for.
  VAIRE_BENCH_DRIVER_MEMORY: "8g"

jobs:
  comet:
    name: Comet acceleration ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
        with:
          disk-cache: false

      # Own the sbt 2 disk cache so its key is scoped to the sbt version
      # (project/build.properties); same rationale as ci.yml and stress.yml.
      - name: Cache sbt 2.x disk cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sbt
          key: sbt-disk-${{ runner.os }}-jdk25-${{ hashFiles('project/build.properties') }}-${{ hashFiles('build.sbt', 'project/*.sbt') }}-v1
          restore-keys: |
            sbt-disk-${{ runner.os }}-jdk25-${{ hashFiles('project/build.properties') }}-

      # The gate builds the bench jar (sbt spark/assembly), builds the cluster image (which
      # downloads the pinned 98 MB Comet snapshot), runs the plan set on plain Spark and with Comet
      # at both scale orders, then ratchets the Comet operator inventory against
      # comet-coverage.json. It needs Docker, so it is not part of the fast PR gate.
      - name: Run Comet coverage ratchet
        run: scripts/comet-bench.sh check
        timeout-minutes: 60
