rules = [
  ExplicitResultTypes,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  ProcedureSyntax,
  RemoveUnused,
  DisableSyntax,
  OrganizeImports,
  RedundantSyntax,
]

// These rules apply to ALL code (main and test)
ExplicitResultTypes {
  fetchScala3CompilerArtifactsOnVersionMismatch = true
}

OrganizeImports {
  groupedImports = Keep
  groups = ["*", "re:(javax?|scala)\\.", "net.ghoula.vaire"]
  removeUnused = true
  targetDialect = Scala3
}

// Strict rules applied to ALL code (main and test)
DisableSyntax {
  noVars = true
  noThrows = true
  noNulls = true
  noReturns = true
  noIsInstanceOf = true
  noFinalVal = true
  noFinalize = true
  noCovariant = true
  noContravariant = true
  noAsInstanceOf = true
}

// No exceptions - enforce everywhere
// Use scalafix:ok annotations for architecturally necessary violations
