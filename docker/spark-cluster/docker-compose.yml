services:
  spark-master:
    build: .
    image: vaire-spark-cluster
    container_name: spark-master
    network_mode: host
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: 127.0.0.1
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    volumes:
      - ../../vaire-core/target/scala-3.8.2/classes:/opt/vaire/core-classes:ro
      - ../../vaire-spark/target/scala-3.8.2/classes:/opt/vaire/spark-classes:ro

  spark-worker-1:
    image: vaire-spark-cluster
    container_name: spark-worker-1
    network_mode: host
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://127.0.0.1:7077
    environment:
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: 32g
      SPARK_WORKER_WEBUI_PORT: "8081"
    volumes:
      - ../../vaire-core/target/scala-3.8.2/classes:/opt/vaire/core-classes:ro
      - ../../vaire-spark/target/scala-3.8.2/classes:/opt/vaire/spark-classes:ro
      - /tmp:/tmp

  spark-worker-2:
    image: vaire-spark-cluster
    container_name: spark-worker-2
    network_mode: host
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://127.0.0.1:7077
    environment:
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: 32g
      SPARK_WORKER_WEBUI_PORT: "8082"
    volumes:
      - ../../vaire-core/target/scala-3.8.2/classes:/opt/vaire/core-classes:ro
      - ../../vaire-spark/target/scala-3.8.2/classes:/opt/vaire/spark-classes:ro
      - /tmp:/tmp
